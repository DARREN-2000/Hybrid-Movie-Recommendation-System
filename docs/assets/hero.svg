<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7676;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="300" rx="15" ry="15" fill="url(#grad1)" stroke="#30363d" stroke-width="1.5" />

  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#21262d" stroke-width="2" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Central Node -->
    <circle cx="0" cy="0" r="45" fill="url(#grad2)" filter="url(#glow)" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">🎬</text>

    <!-- Orbiting Nodes -->
    <g transform="rotate(0)">
      <circle cx="100" cy="0" r="20" fill="#2ea043" />
      <text x="100" y="2" font-family="Arial" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">Scikit</text>
    </g>
    <g transform="rotate(120)">
      <circle cx="100" cy="0" r="20" fill="#1f6feb" />
      <text x="100" y="2" font-family="Arial" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">Pandas</text>
    </g>
    <g transform="rotate(240)">
      <circle cx="100" cy="0" r="20" fill="#d29922" />
      <text x="100" y="2" font-family="Arial" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">TMDB</text>
    </g>
  </g>

  <text x="400" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Hybrid Movie Recommendation Engine</text>
  <text x="400" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Enterprise-Grade Content &amp; Collaborative Filtering</text>
</svg>
