<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Hybrid Movie Recommendation System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css" />
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
  <script>
    stlite.mount({
      requirements: ["pandas", "scikit-learn", "requests"],
      entrypoint: "app.py",
      files: {
        "app.py": {
          url: "app.py"
        },
        "main_data.csv": {
          url: "main_data.csv"
        }
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
